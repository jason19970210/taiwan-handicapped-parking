name: Update Taiwan Handicapped Parking Data

on:
  schedule:
    # Monday at 9am UTC+8 = 1am UTC
    - cron: '0 1 * * 1'
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.11'
  DATA_FILE: 'data/parking_locations.csv'
  LISTS_DIR: 'data/lists'
  BRANCH_PREFIX: 'update-parking-data'

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    # Whole job: install + collect (<= 20 min, see step) + build-lists + diff/commit/push + log upload.
    timeout-minutes: 30
    outputs:
      data_changed: ${{ steps.check_diff.outputs.changed }}
      commit_sha: ${{ steps.commit_changes.outputs.commit_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip list

      - name: Restore data cache
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: parking-data-cache-${{ github.run_id }}
          restore-keys: |
            parking-data-cache-

      - name: Download and process data
        id: process_data
        # The New Taipei crawl stops itself after 10 min (crawl_deadline_seconds) and a healthy
        # run takes well under 2 min. This step limit only backs that up and, being below the job
        # limit, leaves 10 min for the always() cache/log steps and the commit steps.
        timeout-minutes: 20
        run: |
          python scripts/main.py collect
        env:
          LOG_LEVEL: INFO

      # Regenerate the per-district lists (data/lists, which the ubuntu Maps sync reads) from the
      # CSV just collected. No continue-on-error: if this fails the job fails and nothing is committed.
      - name: Build district lists
        id: build_lists
        run: |
          python scripts/main.py build-lists

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: parking-data-cache-${{ github.run_id }}

      - name: Check for changes
        id: check_diff
        run: |
          # --porcelain also reports new, deleted and untracked files under data/lists
          CHANGES="$(git status --porcelain -- ${{ env.DATA_FILE }} ${{ env.LISTS_DIR }})"
          if [ -z "$CHANGES" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in parking data or lists"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in parking data or lists"
            echo "$CHANGES"
            echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$CHANGES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create temporary branch and commit
        id: commit_changes
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          BRANCH_NAME="${{ env.BRANCH_PREFIX }}-${TIMESTAMP}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add -A ${{ env.DATA_FILE }} ${{ env.LISTS_DIR }}
          git commit -m "$(cat <<'EOF'
          chore: update parking data - $TIMESTAMP

          Automated update of Taiwan handicapped parking locations.

          Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>
          EOF
          )"
          git push origin "$BRANCH_NAME"

          # Merge to main
          git checkout main
          git merge "$BRANCH_NAME" --no-ff -m "Merge parking data update - $TIMESTAMP"
          git push origin main

          # Cleanup branch
          git push origin --delete "$BRANCH_NAME"

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

          echo "### Data Updated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Commit: $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-collection-logs
          path: logs/
          retention-days: 30
